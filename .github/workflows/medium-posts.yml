# Keeps the "Writing" section on my site up to date.
# Every morning it reads my Medium feed and saves my latest posts to assets/data/medium.json.
# I can also run it straight away from the Actions tab: "Update Medium posts" → "Run workflow".

name: Update Medium posts

on:
  schedule:
    - cron: "17 6 * * *"   # every day at about 06:17 UTC
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read my Medium feed
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          FEED = "https://medium.com/feed/@oolanrewajudada"
          OUT = "assets/data/medium.json"

          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0 (olanrewajudada.com feed updater)"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          ns = {"content": "http://purl.org/rss/1.0/modules/content/"}

          posts = []
          for item in root.iter("item"):
              title = html.unescape((item.findtext("title") or "").strip())
              url = (item.findtext("link") or "").split("?")[0]
              date = parsedate_to_datetime(item.findtext("pubDate")).date().isoformat()
              body = item.findtext("content:encoded", default="", namespaces=ns)
              body = re.sub(r"<figure.*?</figure>", " ", body, flags=re.S)
              text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", body))).strip()
              if text.lower().startswith(title.lower()):
                  text = text[len(title):].strip()
              words = len(text.split())
              excerpt = text if len(text) <= 200 else text[:200].rsplit(" ", 1)[0] + "…"
              tags = [c.text for c in item.findall("category") if c.text][:3]
              posts.append({"title": title, "url": url, "date": date, "excerpt": excerpt,
                            "minutes": max(1, round(words / 230)), "tags": tags})

          posts.sort(key=lambda p: p["date"], reverse=True)
          os.makedirs(os.path.dirname(OUT), exist_ok=True)
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump({"profile": "https://medium.com/@oolanrewajudada", "posts": posts[:10]},
                        f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Saved {min(len(posts), 10)} posts")
          PY

      - name: Save the update (only if something changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/medium.json
          if git diff --cached --quiet; then
            echo "No new posts."
            exit 0
          fi
          git commit -m "Update Medium posts"
          git push
          # Ask GitHub Pages to republish the site with the new posts
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
